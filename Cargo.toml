[workspace]
resolver = "3"
members = [
  "weather-build-support",
  "weather-schema",
  "weather-core/conf",
  "weather-core/manifest",
  "weather-core/utils",
  "weather-core/db",
  "weather-core/updater",
  "weather-core/engine",
  "weather-core/daemon",
  "weather-renderer/common",
  "weather-renderer/gui/src-tauri",
  "weather-renderer/tui",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "WTFPL"

[profile.release-lto-static]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[workspace.dependencies]
anyhow = "~1.0.0"
chrono = "~0.4.0"
chrono-tz = "~0.10.0"
clap = { version = "~4.5.0", features = ["derive"] }
fs2 = "~0.4.0"
futures = "~0.3.0"
hex = "~0.4.0"
hmac = "~0.12.0"
log = "~0.4.0"
prost = "~0.14.0"
prost-build = "~0.14.0"
protoc-bin-vendored = "~3.0.0"
ratatui = "~0.30.0"
reqwest = { version = "~0.12.0", default-features = false, features = ["json", "rustls-tls", "socks"] }
rusqlite = { version = "~0.32.0", features = ["bundled"] }
same-file = "~1.0.0"
serde = { version = "~1.0.0", features = ["derive"] }
serde_json = "~1.0.0"
sha2 = "~0.10.0"
tempfile = "~3.27.0"
tokio = { version = "~1.45.0", features = ["macros", "rt-multi-thread", "time", "sync", "process", "signal", "net"] }
toml = "~0.8.0"
url = "~2.5.0"
uuid = { version = "~1.23.0", features = ["v4"] }
zeromq = "~0.6.0"
crossterm = "~0.29.0"
tauri = { version = "~2.11.0", features = ["devtools"] }
tauri-build = "~2.6.0"
windows-sys = "~0.61.0"
windows-service = "~0.8.0"
